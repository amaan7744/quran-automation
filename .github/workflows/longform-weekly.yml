name: Long-form weekly (Quran full-Surah)

# ============================================================================
# LONG-FORM WEEKLY WORKFLOW
#
# This file contains GitHub Actions execution wiring ONLY.
#
# Application configuration lives at:
#   longform/longform.yml
#
# Long-form configuration is loaded by:
#   longform/longform_config.py
#
# The repository-root config.py remains the shared configuration used by
# the existing Shorts/Reels pipeline.
#
# PUBLICATION TIMING
#
# This workflow's cron controls when the BUILD starts.
# It does NOT control when the video becomes public.
#
# The weekly flow is:
#
#   Thursday workflow start
#       ↓
#   Render full-Surah video
#       ↓
#   Validate output
#       ↓
#   Upload to YouTube as PRIVATE
#       ↓
#   Set YouTube publishAt
#       ↓
#   Friday 19:00 Asia/Kolkata
#       ↓
#   YouTube automatically makes video PUBLIC
#
# The publication target is configured in:
#   longform/longform.yml
#
#   schedule:
#     day: Friday
#     time: "19:00"
#     timezone: Asia/Kolkata
#
# Thursday 10:00 UTC = Thursday 15:30 IST.
# This provides approximately 27.5 hours before Friday 19:00 IST.
# ============================================================================


on:
  # Thursday 10:00 UTC / Thursday 15:30 Asia/Kolkata.
  #
  # This intentionally starts well before the Friday publication target
  # because a 4K full-Surah render may take several hours.
  schedule:
    - cron: "0 10 * * 4"

  # Allows manual execution from GitHub Actions.
  workflow_dispatch: {}


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# Only one long-form workflow may execute at a time.
#
# Do not cancel an active multi-hour render if another scheduled/manual
# invocation occurs. The second run waits instead.
# ============================================================================

concurrency:
  group: longform-weekly
  cancel-in-progress: false


# ============================================================================
# PERMISSIONS
# ============================================================================
#
# Required because the workflow persists longform_schedule_state.json back
# to the repository.
# ============================================================================

permissions:
  contents: write


# ============================================================================
# JOB
# ============================================================================

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    # Generous limit for 4K full-Surah rendering.
    timeout-minutes: 480

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ----------------------------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi


      # ----------------------------------------------------------------------
      # LONG-FORM PIPELINE
      # ----------------------------------------------------------------------
      #
      # IMPORTANT:
      #
      # The runner executes from repository root.
      #
      # Entry point:
      #   longform/run_weekly_longform.py
      #
      # Long-form configuration:
      #   longform/longform.yml
      #
      # Long-form Python configuration loader:
      #   longform/longform_config.py
      #
      # Shared repository modules remain available from the repository root.
      #
      # PYTHONPATH explicitly includes the repository root so shared modules
      # can be imported reliably.
      # ----------------------------------------------------------------------

      - name: Run weekly long-form pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python longform/run_weekly_longform.py


      # ----------------------------------------------------------------------
      # PERSIST LONG-FORM SCHEDULE STATE
      # ----------------------------------------------------------------------
      #
      # The persistent state machine is stored in:
      #
      #   longform_schedule_state.json
      #
      # The Python pipeline writes the state as it progresses:
      #
      #   pending
      #      ↓
      #   uploaded
      #      ↓
      #   completed
      #
      # IMPORTANT:
      #
      # The upload callback persists the YouTube video ID immediately after
      # a successful upload. This protects against a runner dying between
      # upload and scheduling.
      #
      # This GitHub step makes that state durable across future runners.
      #
      # `always()` means this step is attempted even if the Python pipeline
      # fails.
      #
      # If the Python process dies before creating the state file, this step
      # simply does nothing instead of producing a second failure.
      # ----------------------------------------------------------------------

      - name: Commit updated long-form schedule state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f longform_schedule_state.json ]; then

            git add longform_schedule_state.json

            if git diff --cached --quiet; then
              echo "No long-form schedule state changes to commit."
            else
              git commit -m "chore: update long-form schedule state [skip ci]"
              git push
            fi

          else
            echo "longform_schedule_state.json does not exist."
            echo "No schedule state changes to commit."
          fi
