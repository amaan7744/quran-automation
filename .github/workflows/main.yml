name: Quran Daily Upload

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: quran-daily-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install FFmpeg and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig jq

      - name: Install Fonts
        run: |
          mkdir -p ~/.fonts

          curl -fsSL -o ~/.fonts/DigitalKhattIndoPak.otf \
            https://github.com/DigitalKhatt/indopakfont/releases/download/v1.0.0-beta.1/indopak.otf

          curl -fsSL -o ~/.fonts/Poppins-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf

          curl -fsSL -o ~/.fonts/Poppins-SemiBold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf

          fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Clip Cache
        uses: actions/cache@v4
        with:
          path: .cache/clips
          key: clip-cache-${{ github.run_id }}
          restore-keys: |
            clip-cache-

      # ---------------- DEBUG META TOKEN ----------------
      - name: Verify Meta Token
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          echo "Checking GitHub Secret..."

          curl -s \
            "https://graph.facebook.com/v25.0/me?fields=id,name&access_token=$META_ACCESS_TOKEN" \
            | jq .

      - name: Build Video
        id: build
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build_video.py

      - name: Commit Progress
        if: success()
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

          if [ -f progress.json ]; then
            git add progress.json
          fi

          # analytics.json persists the visual-template/duration explore-
          # exploit history (see performance_metadata.py) across runs —
          # without committing it back, every run would be a cold start
          # and the experimentation framework could never learn which
          # templates/durations actually perform best.
          if [ -f analytics.json ]; then
            git add analytics.json
          fi

          git commit -m "chore: update progress [skip ci]" || echo "No changes"

          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Upload Video
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python upload.py

      - name: Save Upload History
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

          if [ -f upload_history.json ]; then
            git add upload_history.json
          fi

          # upload.py attaches each platform's video/media ID onto the
          # SAME analytics.json record build_video.py created earlier in
          # this run (see performance_metadata.attach_platform_ids) —
          # that happens AFTER the "Commit Progress" step above already
          # ran, so it must be committed again here or the platform ID
          # (which analytics_ingest.py needs to fetch real performance
          # data later) would never make it back to the repo.
          if [ -f analytics.json ]; then
            git add analytics.json
          fi

          git commit -m "chore: update upload history [skip ci]" || echo "No changes"

          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Nothing to push"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            logs/**
            video_metadata.json
            analytics.json
          if-no-files-found: ignore
          retention-days: 7
