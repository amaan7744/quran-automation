name: Quran Daily Upload

on:
  schedule:
manual trigger

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout code + progress file ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # ── Install system deps ───────────────────────────────────────────────────
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-color-emoji \
            fonts-noto-cjk \
            fonts-arabeyes \
            libass9
          fc-cache -fv

      # ── Set up Python ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Install Python dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Build video ───────────────────────────────────────────────────────────
      - name: Build Quran video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python build_video.py

      # ── Upload to platforms ───────────────────────────────────────────────────
      - name: Upload to YouTube, Facebook, Instagram
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN:     ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:      ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python upload.py

      # ── Commit updated progress.json back to repo ─────────────────────────────
      - name: Save progress back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || git commit -m "chore: update Quran progress [skip ci]"
          git push
