name: Quran Daily Upload

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: quran-daily-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==================================================
      # SYSTEM DEPENDENCIES
      # ==================================================
      - name: Install FFmpeg and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig jq

      # ==================================================
      # FONTS
      # ==================================================
      - name: Install Fonts
        run: |
          mkdir -p ~/.fonts

          curl -fsSL -o ~/.fonts/DigitalKhattIndoPak.otf \
            https://github.com/DigitalKhatt/indopakfont/releases/download/v1.0.0-beta.1/indopak.otf

          curl -fsSL -o ~/.fonts/Poppins-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf

          curl -fsSL -o ~/.fonts/Poppins-SemiBold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf

          fc-cache -fv

      # ==================================================
      # PYTHON DEPENDENCIES
      # ==================================================
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # LOCAL CLIP CACHE
      #
      # IMPORTANT:
      # Do NOT use actions/cache for .cache/clips.
      #
      # The previous workflow restored a ~4.7 GB archive,
      # which exhausted the GitHub Actions runner disk while
      # extracting the cache.
      #
      # The cache is intentionally runner-local and starts
      # empty on each GitHub-hosted runner.
      # ==================================================
      - name: Prepare Clip Cache
        run: |
          mkdir -p .cache/clips
          echo "Prepared runner-local clip cache."

      # ==================================================
      # VERIFY META ACCESS TOKEN
      # ==================================================
      - name: Verify Meta Token
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          echo "Checking Meta access token..."

          if [ -z "$META_ACCESS_TOKEN" ]; then
            echo "ERROR: META_ACCESS_TOKEN secret is not configured."
            exit 1
          fi

          curl -fsS \
            "https://graph.facebook.com/v25.0/me?fields=id,name&access_token=$META_ACCESS_TOKEN" \
            | jq .

      # ==================================================
      # BUILD VIDEO
      # ==================================================
      - name: Build Video
        id: build
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python build_video.py

      # ==================================================
      # COMMIT BUILD PROGRESS
      # ==================================================
      - name: Commit Progress
        if: success()
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

          if [ -f progress.json ]; then
            git add progress.json
          fi

          if [ -f analytics.json ]; then
            git add analytics.json
          fi

          if git diff --cached --quiet; then
            echo "No progress changes to commit."
          else
            git commit -m "chore: update progress [skip ci]"
          fi

          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Nothing to push."

      # ==================================================
      # UPLOAD VIDEO
      # ==================================================
      - name: Upload Video
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python upload.py

      # ==================================================
      # SAVE UPLOAD HISTORY
      # ==================================================
      - name: Save Upload History
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

          if [ -f upload_history.json ]; then
            git add upload_history.json
          fi

          if [ -f analytics.json ]; then
            git add analytics.json
          fi

          if git diff --cached --quiet; then
            echo "No upload history changes to commit."
          else
            git commit -m "chore: update upload history [skip ci]"
          fi

          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Nothing to push."

      # ==================================================
      # UPLOAD LOGS / METADATA
      # ==================================================
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            logs/**
            video_metadata.json
            analytics.json
          if-no-files-found: ignore
          retention-days: 7
