name: Quran Daily Upload

on:
  schedule:
    - cron
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for saving progress.json
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-arapey fonts-noto fontconfig
          fc-cache -fv
          pip install -r requirements.txt

      - name: Build Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python build_video.py

      - name: Upload
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_ACCESS_TOKEN:     ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:      ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python upload.py

      - name: Save and Push Progress
        if: success()
        run: |
          # 1. Identity Setup
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # 2. Update progress file locally
          python -c "import json; from audio_downloader import write_file_progress; m=json.load(open('video_metadata.json')); write_file_progress(m['surah_num'], m['last_ayah'])"
          
          # 3. Commit, sync, and push
          git add progress.json
          git commit -m "chore: update progress [skip ci]" || echo "No changes"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          git pull --rebase origin main
          git push origin main
