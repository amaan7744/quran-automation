# ═══════════════════════════════════════════════════════════════════════════
# longform.yml
# Configuration for the LONG-FORM (full-Surah) YouTube pipeline ONLY.
#
# This file is read ONLY by the long-form pipeline (config.py loads it and
# uses it to override the LONGFORM_* constants; see the loader at the
# bottom of config.py). It has no effect on Shorts/Reels — the short-form
# pipeline (build_video.py / upload.py) never reads this file or anything
# below the LONGFORM_* line in config.py.
#
# Every key here has a safe fallback already defined in config.py, so
# deleting a key (or this whole file) does not break the pipeline — it
# just falls back to the Python default.
# ═══════════════════════════════════════════════════════════════════════════

# Master switch for the whole long-form pipeline. When false, run_weekly_longform.py
# logs and exits without building or uploading anything.
enabled: true

# This is the TARGET YOUTUBE PUBLICATION SCHEDULE — not "when the workflow
# runs". Long-form rendering can take hours, so the GitHub Actions workflow
# now starts the build well BEFORE this time (see the cron comment in
# .github/workflows/longform-weekly.yml), renders/validates/uploads the
# video PRIVATE, and then configures YouTube's own scheduled-publish
# mechanism (status.publishAt) to flip it public at exactly this day/time.
# run_weekly_longform.py only validates that this block is well-formed
# (valid weekday name / HH:MM / IANA timezone) — it no longer compares the
# current time against it before deciding whether to run. Manual runs
# (workflow_dispatch, or `--force`) skip even that validation.
schedule:
  day: Friday            # Mon/Tue/Wed/Thu/Fri/Sat/Sun — publication day
  time: "19:00"           # 24h HH:MM, local to `timezone` — publication time
  timezone: Asia/Kolkata
  # Minimum lead time (in minutes) the run expects to have between the
  # workflow starting and `time` above. If less than this remains when the
  # run starts, it logs a warning (build proceeds regardless — this is a
  # heads-up to move the cron earlier, not a hard gate).
  grace_minutes: 90

# Output video settings.
video:
  width: 3840
  height: 2160
  fps: 30
  crf: 18                 # libx264 quality (16-20 = high-quality 4K range)
  audio_bitrate: "320k"
  audio_sample_rate: 48000

# Background footage.
background:
  min_width: 2560          # 1440p floor; below this a clip is rejected outright
  min_height: 1440
  native_4k_width: 3840     # at/above this is logged as genuine native 4K
  native_4k_height: 2160
  clip_trim_min: 12.0       # seconds per clip — long-form scenes breathe, not "every few seconds"
  clip_trim_max: 20.0
  transition_duration: 1.5  # slow cinematic crossfade
  avoid_duplicates: true    # enforced via the persistent Pexels clip-ID cache index

# Subtitle styling.
subtitles:
  arabic_font: "DigitalKhatt IndoPak"
  english_font: "Poppins"
  translation_source: "Saheeh International"

# Intro / outro.
intro_outro:
  intro_enabled: true
  outro_enabled: true
  intro_duration: 6.0
  outro_duration: 8.0
  outro_message: "May Allah accept our worship"

# Thumbnail.
thumbnail:
  enabled: true

# YouTube publish settings.
youtube:
  # Status the video is UPLOADED with. Always "private" in the normal
  # weekly flow — the video must never be public before the scheduled
  # publication time above flips it.
  upload_privacy: private          # private | unlisted | public
  # Whether to configure YouTube's native scheduled-publish mechanism
  # (status.publishAt) using the `schedule:` block above, so YouTube itself
  # makes the video public at the target time with no runner kept alive.
  # If false, the video is uploaded and left at `upload_privacy` with no
  # scheduled publish configured (matches the old ad-hoc/manual behavior).
  schedule_publish: true
  category: "22"             # "People & Blogs"
  playlist_id: ""

# Pre-upload validation thresholds. These are intentionally NOT toggleable
# down to "off" — the point of validation is that a failed check blocks
# upload, full stop (see surah_validator.py). Listed here only so the
# requirement is visible/auditable in one place, matching the spec.
validation:
  require_4k: true
  require_audio: true
  require_subtitles: true
  require_thumbnail: true

# Sequential Surah selection for the weekly automation (see surah_schedule.py).
# Random selection is intentionally NOT supported — the whole Quran is
# published in order, one Surah per Friday.
surah:
  selection: sequential
  start: 1        # Surah number to begin from if no schedule state exists yet
  wrap: true       # after Surah 114, loop back to 1 and keep publishing weekly
