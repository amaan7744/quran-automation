# ═══════════════════════════════════════════════════════════════════════════
# longform.yml
# Configuration for the LONG-FORM (full-Surah) YouTube pipeline ONLY.
#
# This file is read only by the long-form configuration loader:
#
#     longform/longform_config.py
#
# It is intentionally separate from the repository-root `config.py`,
# which is shared infrastructure used by the Shorts/Reels pipeline.
#
# This file has NO direct effect on Shorts/Reels.
#
# Every setting has a safe Python fallback. If this file is missing or a
# setting is omitted, the long-form pipeline falls back to its default.
# ═══════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────
# MASTER SWITCH
# ───────────────────────────────────────────────────────────────────────────

# Disable the entire long-form pipeline without affecting Shorts/Reels.
enabled: true


# ───────────────────────────────────────────────────────────────────────────
# PUBLICATION SCHEDULE
# ───────────────────────────────────────────────────────────────────────────

# IMPORTANT:
# This is the TARGET YOUTUBE PUBLICATION TIME.
#
# It is NOT the time at which GitHub Actions should start.
#
# The GitHub Actions workflow must start sufficiently early to:
#
#   build → render → validate → upload privately → schedule on YouTube
#
# YouTube then makes the video public automatically at this target time.
schedule:
  day: Friday
  time: "19:00"
  timezone: Asia/Kolkata

  # Minimum expected lead time before the target publication time.
  #
  # If the workflow starts with less than this amount of time remaining,
  # the runner logs a warning but DOES NOT stop the build.
  grace_minutes: 90


# ───────────────────────────────────────────────────────────────────────────
# VIDEO OUTPUT
# ───────────────────────────────────────────────────────────────────────────
#
# QUALITY PRESET NOTE:
# Dropped from native 4K to 1080p as the default. GitHub-hosted Actions
# runners are hard-capped at 6 hours of job execution time (this cannot
# be raised even via a larger workflow `timeout-minutes`) and guarantee
# only ~14GB of disk. A 4K/CRF18/"slow" render of a genuinely multi-hour
# Surah could not reliably finish inside either limit.
#
# To bump a SPECIFIC run to 1440p (e.g. for a shorter Surah where there's
# time/disk to spare), either:
#   - edit width/height/crf here to 2560/1440/19, or
#   - use the "quality" input on a manual workflow_dispatch run of
#     longform-weekly.yml, which sets LONGFORM_VIDEO_WIDTH/HEIGHT/CRF/PRESET
#     env vars that override this file for that run only (see
#     longform_config.py's "PER-RUN QUALITY OVERRIDE" section).
video:
  width: 1920
  height: 1080
  fps: 30

  # libx264 CRF. 20 is a couple of steps softer than the old 4K value of
  # 18 — at 1080p this still looks clean, and it trims encode time too.
  crf: 20

  # libx264 preset. This is the single biggest lever for encode SPEED
  # (independent of resolution/CRF, which control quality/size). The
  # renderer previously hardcoded "slow", which is the main reason a
  # multi-hour render could blow the 6-hour runner cap even at a lower
  # resolution. "veryfast" trades a modest amount of compression
  # efficiency (a slightly larger file at the same CRF) for a large,
  # direct cut in wall-clock time.
  preset: "veryfast"

  audio_bitrate: "320k"
  audio_sample_rate: 48000


# ───────────────────────────────────────────────────────────────────────────
# BACKGROUND FOOTAGE
# ───────────────────────────────────────────────────────────────────────────

background:

  # Minimum accepted source resolution. Kept in sync with video.width/
  # height above — sourcing 1440p+ footage for a 1080p render just burns
  # extra download time and disk without the output ever using those
  # extra pixels. If you bump video.width/height above to 1440p, bump
  # these to match (2560 / 1440).
  min_width: 1920
  min_height: 1080

  # Threshold for "this clip is native resolution" (matches or exceeds
  # the configured render target above) vs "accepted but will be
  # upscaled on render." Kept equal to video.width/height for the same
  # reason as min_width/min_height above. (Key names kept as
  # native_4k_width/height for backward compatibility with existing
  # longform_config.py — they mean "native to the render target," not
  # literally 4K, now that the default target is 1080p.)
  native_4k_width: 1920
  native_4k_height: 1080

  # Long-form scenes should breathe instead of changing every few seconds.
  clip_trim_min: 12.0
  clip_trim_max: 20.0

  # Slow cinematic crossfade between scenes.
  transition_duration: 1.5

  # Prevent the same Pexels clip from being repeatedly selected.
  # The persistent clip-ID cache is handled by the long-form pipeline.
  avoid_duplicates: true


# ───────────────────────────────────────────────────────────────────────────
# SUBTITLES
# ───────────────────────────────────────────────────────────────────────────

subtitles:
  arabic_font: "DigitalKhatt IndoPak"
  english_font: "Poppins"
  translation_source: "Saheeh International"


# ───────────────────────────────────────────────────────────────────────────
# INTRO / OUTRO
# ───────────────────────────────────────────────────────────────────────────

intro_outro:
  intro_enabled: true
  outro_enabled: true

  intro_duration: 6.0
  outro_duration: 8.0

  outro_message: "May Allah accept our worship"


# ───────────────────────────────────────────────────────────────────────────
# THUMBNAIL
# ───────────────────────────────────────────────────────────────────────────

thumbnail:
  enabled: true


# ───────────────────────────────────────────────────────────────────────────
# YOUTUBE
# ───────────────────────────────────────────────────────────────────────────

youtube:

  # The video is uploaded privately first.
  #
  # YouTube's scheduled publication mechanism then changes it to PUBLIC
  # at the configured Friday 19:00 Asia/Kolkata publication time.
  #
  # Normal weekly flow should remain:
  #
  #     private → scheduled → public
  upload_privacy: private

  # Enable YouTube native scheduled publication.
  schedule_publish: true

  # YouTube category:
  # 22 = People & Blogs
  category: "22"

  # Optional playlist.
  # Leave empty to skip automatic playlist assignment.
  playlist_id: ""


# ───────────────────────────────────────────────────────────────────────────
# PRE-UPLOAD VALIDATION
# ───────────────────────────────────────────────────────────────────────────

# These are mandatory quality gates.
#
# A failed validation MUST block the YouTube upload.
#
# They are deliberately not configurable as "optional" requirements here.
#
# NOTE: require_4k is a naming holdover from when 4K was the only target.
# The actual enforcement (in surah_validator.validate_final_video) checks
# the rendered file's resolution against whatever video.width/height is
# configured above — currently 1080p by default — not literally 4K.
validation:
  require_4k: true
  require_audio: true
  require_subtitles: true
  require_thumbnail: true


# ───────────────────────────────────────────────────────────────────────────
# SURAH SELECTION
# ───────────────────────────────────────────────────────────────────────────

# The weekly long-form pipeline publishes Surahs sequentially.
#
# Example:
#
#   Week 1  → Surah 1
#   Week 2  → Surah 2
#   Week 3  → Surah 3
#   ...
#   Week 114 → Surah 114
#
# Persistent progress is stored separately in:
#
#     longform_schedule_state.json
#
# Therefore `start` is only used when there is no existing schedule state.
surah:
  selection: sequential

  # Initial Surah when no persistent state exists.
  start: 1

  # After Surah 114, return to Surah 1 and continue weekly.
  wrap: true
